name: Deploy — vpclick.vpsistema.com

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build + Deploy Hostinger (SFTP/SSH)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm install

      - name: Build producao
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.VITE_SUPABASE_SERVICE_ROLE_KEY }}

      # O Hostinger deste projeto expõe apenas SSH/SFTP na porta 65002 — o deploy
      # antigo usava FTP (porta 21) e falhava sempre com "530 Login incorrect".
      # Enviamos o build por SFTP usando as mesmas credenciais SSH.
      # A chave privada vai no secret HOSTINGER_SSH_KEY_B64 em base64 (linha única),
      # para não corromper ao copiar/colar do terminal. Decodificamos aqui e
      # enviamos ./dist via SCP por SSH (porta 65002).
      - name: Deploy via SSH/SCP para Hostinger
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_KEY_B64: ${{ secrets.HOSTINGER_SSH_KEY_B64 }}
        run: |
          set -e
          # O secret pode conter a chave crua (PEM) OU base64 — aceitamos ambos.
          printf '%s' "$SSH_KEY_B64" | tr -d '\r' > key_src
          if grep -q 'PRIVATE KEY' key_src; then
            cp key_src deploy_key                        # já é PEM cru
          else
            tr -d '[:space:]' < key_src | base64 -d > deploy_key 2>/dev/null \
              || { echo 'ERRO: secret HOSTINGER_SSH_KEY_B64 não é PEM nem base64 válido'; exit 1; }
          fi
          rm -f key_src
          chmod 600 deploy_key
          head -n1 deploy_key | grep -q 'PRIVATE KEY' \
            || { echo 'ERRO: conteúdo do secret não resultou numa chave privada válida'; exit 1; }

          # Mostra a CHAVE PÚBLICA correspondente (seguro de logar). Se o deploy
          # falhar com "Permission denied (publickey)", é esta chave que precisa
          # ser autorizada no painel da Hostinger (hPanel → Avançado → Acesso SSH).
          echo '── Chave pública usada neste deploy ─────────────────────────'
          ssh-keygen -y -f deploy_key || { echo 'ERRO: chave privada inválida (ssh-keygen não conseguiu derivar a pública)'; exit 1; }
          echo '──────────────────────────────────────────────────────────────'

          mkdir -p ~/.ssh
          ssh-keyscan -p 65002 "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          REMOTE_DIR="/home/$SSH_USER/domains/vpclick.vpsistema.com/public_html"

          # O scp só soma arquivos — nunca apagou os de deploys anteriores.
          # Bundles antigos (com bugs já corrigidos) ficavam acumulados e
          # continuavam sendo servidos pra quem tinha o index.html antigo em
          # cache, de forma indefinida. Limpa o conteúdo do diretório remoto
          # antes de enviar o build atual, para que só o build corrente exista.
          if ! ssh -i deploy_key -p 65002 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$SSH_USER@$SSH_HOST" \
            "find '$REMOTE_DIR' -mindepth 1 -delete"; then
            echo '⚠️  Não foi possível limpar o diretório remoto antes do upload (seguindo mesmo assim).'
          fi

          # "dist/*" é expandido pelo Bash ANTES do scp rodar, e por padrão o
          # glob "*" não pega arquivos começando com ponto — o .htaccess do
          # build nunca era enviado (confirmado: PRs #45/#47 setavam headers
          # de cache que nunca chegavam ao servidor). "dist/." não passa por
          # glob nenhum (não tem "*"), então o scp -r copia o CONTEÚDO do
          # diretório, .htaccess incluído, sem criar uma pasta "dist" aninhada
          # no destino — mesma semântica de "cp -r origem/. destino/".
          if ! scp -i deploy_key -P 65002 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -r dist/. \
            "$SSH_USER@$SSH_HOST:$REMOTE_DIR/"; then
            echo ''
            echo '❌ DEPLOY FALHOU: o servidor recusou a autenticação SSH.'
            echo 'CORREÇÃO: copie a chave pública exibida acima (linha começando com ssh-)'
            echo 'e cadastre no painel da Hostinger: hPanel → Avançado → Acesso SSH → Adicionar chave SSH.'
            echo 'Depois, rode este workflow de novo (aba Actions → Deploy → Run workflow).'
            rm -f deploy_key
            exit 1
          fi
          rm -f deploy_key
          echo 'Arquivos enviados para vpclick.vpsistema.com'

      # O scp pode terminar com sucesso e ainda assim deixar o site quebrado —
      # já aconteceu: o index.html subiu mas os bundles .js não, e o site ficou
      # em tela branca (sem JS o React nunca inicia) por dias, com o deploy
      # marcado como verde. Aqui buscamos a página publicada de verdade e
      # exigimos que todo asset que ela referencia esteja servível.
      - name: Verificar que o site publicado está servível
        run: |
          set -e
          SITE='https://vpclick.vpsistema.com'
          echo "Buscando $SITE/index.html publicado..."
          curl -fsS -H 'Cache-Control: no-cache' "$SITE/?cachebust=$GITHUB_RUN_ID" -o published.html

          ASSETS=$(grep -oE '(src|href)="/assets/[^"]+"' published.html | sed 's/.*"\(.*\)"/\1/' | sort -u)
          if [ -z "$ASSETS" ]; then
            echo '❌ O index.html publicado não referencia nenhum asset — build ou envio inválido.'
            exit 1
          fi

          # Conferir só o código HTTP não basta: o fallback de SPA do .htaccess
          # respondia 200 com o conteúdo do index.html para qualquer arquivo
          # ausente, então um bundle faltando passava como "ok" aqui. Agora o
          # /assets/ está fora do fallback (asset ausente = 404 de verdade), e
          # esta checagem também exige que o tipo do conteúdo seja de fato
          # JS/CSS — se algum dia o fallback voltar a pegar /assets/, o HTML
          # disfarçado de bundle é detectado na hora em vez de passar batido.
          FALHAS=0
          for asset in $ASSETS; do
            LINHA=$(curl -s -o /dev/null -w '%{http_code} %{content_type}' "$SITE$asset")
            CODE=${LINHA%% *}
            TIPO=${LINHA#* }
            if [ "$CODE" != "200" ]; then
              echo "  FALHA $asset (HTTP $CODE)"
              FALHAS=$((FALHAS + 1))
            elif printf '%s' "$TIPO" | grep -qi 'text/html'; then
              echo "  FALHA $asset (HTTP 200 mas veio HTML: '$TIPO' — arquivo não existe no servidor)"
              FALHAS=$((FALHAS + 1))
            else
              echo "  ok   $asset ($TIPO)"
            fi
          done

          if [ "$FALHAS" -gt 0 ]; then
            echo ''
            echo "❌ DEPLOY INCOMPLETO: $FALHAS asset(s) que a página precisa não estão no servidor."
            echo 'O site está fora do ar (tela branca) — usuários não conseguem entrar.'
            echo ''
            echo 'O que verificar na Hostinger (hPanel):'
            echo '  1. Espaço em disco / cota da conta — envio pode ter sido truncado.'
            echo '  2. Scanner de malware (Imunify/Monarx): bundles .js grandes e minificados'
            echo '     são falso-positivo comum e podem ser postos em quarentena após o envio.'
            echo '  3. Confira a pasta domains/vpclick.vpsistema.com/public_html/assets/ via SSH.'
            exit 1
          fi

          echo ''
          echo '✅ Deploy verificado: index.html e todos os assets respondendo em produção.'
